# Checks a proposed change and packages the finished site so it can be inspected.
# GitHub Pages has no built-in preview, so download the "site-preview" file from
# the bottom of the run's summary page, unzip it and open index.html.
name: Check pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check pages, links, manifest and service worker
        run: python3 scripts/check_site.py

      - name: Assemble the site folder
        run: python3 scripts/build.py assemble

      - name: Download the fonts
        run: bash scripts/fetch_fonts.sh _site/assets/fonts

      - name: Finish the build
        run: python3 scripts/build.py finalize

      - name: Package the site for inspection
        uses: actions/upload-artifact@v7
        with:
          name: site-preview
          path: _site
          retention-days: 14
