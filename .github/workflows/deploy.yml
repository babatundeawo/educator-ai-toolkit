# Builds, checks and publishes the site to GitHub Pages.
# Runs on every push to main, on pull requests (checks only, no publishing),
# and on demand from the Actions tab.
name: Deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: read the code, publish only to Pages.
permissions:
  contents: read

# Never run two deployments at once; a newer push replaces a queued one.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Check pages, links and metadata
        run: python3 scripts/check_site.py

      - name: Assemble the site folder
        run: |
          mkdir _site
          cp -r *.html assets files _site/
          cp manifest.webmanifest robots.txt sitemap.xml _site/

      - name: Set up Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  quality:
    name: Quality report (does not block publishing)
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site folder
        run: |
          mkdir _site
          cp -r *.html assets files _site/
          cp manifest.webmanifest robots.txt sitemap.xml _site/

      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 1 --timeout 20 --accept 200,201,204,301,302,403,429 --exclude '^https://(telegram\.me|t\.me|chat\.whatsapp\.com)' './*.html'
          fail: false

      - name: Lighthouse report
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true

  deploy:
    name: Publish
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
