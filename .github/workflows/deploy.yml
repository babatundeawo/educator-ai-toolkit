# Checks, builds and publishes the site to GitHub Pages.
# Runs on every push to main and on demand from the Actions tab.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the code; the publish job alone may write to Pages.
permissions:
  contents: read

# Never run two deployments at once; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Check pages, links, manifest and service worker
        run: python3 scripts/check_site.py

      - name: Assemble the site folder
        run: python3 scripts/build.py assemble

      - name: Download the fonts (free, open licence)
        run: bash scripts/fetch_fonts.sh _site/assets/fonts

      - name: Take app-store style screenshots
        continue-on-error: true
        run: |
          mkdir -p _site/assets/screenshots
          (cd _site && python3 -m http.server 8080 >/dev/null 2>&1 &) ; sleep 2
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=9000 \
            --window-size=1280,800 --screenshot=_site/assets/screenshots/wide.png http://localhost:8080/index.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=9000 \
            --window-size=540,960 --screenshot=_site/assets/screenshots/narrow.png http://localhost:8080/index.html

      - name: Finish the build
        run: python3 scripts/build.py finalize

      - name: Set up Pages
        uses: actions/configure-pages@v6

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Keep the screenshots for the README
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: _site/assets/screenshots
          if-no-files-found: ignore

  quality:
    name: Quality report (never blocks publishing)
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Assemble the site folder
        run: python3 scripts/build.py assemble

      - name: Download the fonts
        run: bash scripts/fetch_fonts.sh _site/assets/fonts

      - name: Check HTML
        continue-on-error: true
        run: npx --yes html-validate@latest --config .htmlvalidate.json "_site/*.html"

      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 1 --timeout 20 --accept 200,201,204,301,302,403,429 --exclude '^https://(telegram\.me|t\.me|chat\.whatsapp\.com)' './_site/*.html'
          fail: false

      - name: Lighthouse report (mobile)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
