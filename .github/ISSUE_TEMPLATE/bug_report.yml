name: Report a problem
description: Something is wrong, broken, or unclear on the site
labels: [bug]
body:
  - type: input
    id: page
    attributes:
      label: Page address
      placeholder: https://babatundeawo.github.io/educator-ai-toolkit/setup.html
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What went wrong?
      description: Tell us what you expected and what happened instead.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: Android phone, Chrome
